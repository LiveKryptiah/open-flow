<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenFlow Work OS • Security Authentication Gateway</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Geist', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['Geist Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f8fafc',
              100: '#f1f5f9',
              500: '#64748b',
              600: '#475569',
              900: '#0f172a',
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Geist Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
  
  <script>
    // If user is already authenticated and didn't explicitly log out, redirect to main workspace
    (function() {
      const isLoggedOut = localStorage.getItem('openflow_logged_out') === 'true';
      const token = localStorage.getItem('openflow_session_token');
      const user = localStorage.getItem('openflow_user');
      if (!isLoggedOut && token && user) {
        window.location.replace('/');
      }
    })();
  </script>
</head>
<body class="min-h-screen flex flex-col antialiased bg-slate-50 dark:bg-[#0f0f12] text-slate-900 dark:text-slate-100 transition-colors duration-200">

  <!-- Ambient Background Lighting -->
  <div class="fixed -top-40 -left-40 w-96 h-96 bg-blue-500/10 dark:bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed -bottom-40 -right-40 w-96 h-96 bg-purple-500/10 dark:bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Gateway Top Bar -->
  <header class="relative z-10 px-6 py-4 flex items-center justify-between border-b border-slate-200 dark:border-slate-800/80 bg-white/80 dark:bg-[#121214]/80 backdrop-blur-md transition-colors">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-slate-900 dark:bg-[#27272a] border border-slate-700/50 flex items-center justify-center shadow-xs">
        <i data-lucide="layers" class="w-4.5 h-4.5 text-white"></i>
      </div>
      <div>
        <span class="text-sm font-semibold text-slate-900 dark:text-white tracking-tight flex items-center gap-2">
          <span>OpenFlow</span>
          <span class="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-100 dark:bg-[#27272a] text-slate-600 dark:text-slate-300 font-mono font-medium border border-slate-200 dark:border-[#38383e]">Work OS</span>
        </span>
        <p class="text-[10px] text-slate-400 font-mono">Enterprise Zero-Trust Authentication</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button type="button" id="gateThemeToggleBtn" onclick="toggleTheme()" class="p-2 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white rounded-lg hover:bg-slate-200 dark:hover:bg-[#27272a] border border-slate-200 dark:border-[#27272a] transition-colors" title="Toggle Theme">
        <i id="gateThemeToggleIcon" data-lucide="sun" class="w-4 h-4 text-amber-500"></i>
      </button>
    </div>
  </header>

  <!-- Gateway Center Body -->
  <main class="relative z-10 flex-1 flex items-center justify-center p-4 sm:p-6">
    <div class="max-w-md w-full">
      
      <div class="bg-white dark:bg-[#18181c] rounded-2xl shadow-2xl border border-slate-200 dark:border-[#27272a] p-6 sm:p-8 space-y-5">
        
        <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
          <div>
            <h2 class="text-sm font-semibold text-slate-900 dark:text-white">Security Access Portal</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400">Sign in to unlock your private workspaces</p>
          </div>
          <div class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-[#27272a] text-slate-600 dark:text-zinc-300 flex items-center justify-center border border-slate-200 dark:border-[#38383e]">
            <i data-lucide="shield-check" class="w-4 h-4 text-emerald-500"></i>
          </div>
        </div>

        <!-- Tab Switcher (Sign In vs Register) -->
        <div class="flex items-center p-1 bg-slate-100 dark:bg-[#202024] rounded-lg text-xs font-medium border border-slate-200 dark:border-[#2c2c32]">
          <button type="button" id="gateTabLoginBtn" onclick="switchGatewayTab('login')" class="flex-1 py-1.5 rounded-md bg-white dark:bg-[#28282e] text-slate-900 dark:text-white shadow-2xs transition-all text-center">
            Sign In
          </button>
          <button type="button" id="gateTabRegisterBtn" onclick="switchGatewayTab('register')" class="flex-1 py-1.5 rounded-md text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all text-center">
            Create Account
          </button>
        </div>

        <!-- Alert Box -->
        <div id="gateAlertBox" class="hidden p-3 rounded-lg text-xs font-medium"></div>

        <!-- TAB 1: GATEWAY LOGIN FORM -->
        <form id="gateLoginForm" onsubmit="event.preventDefault(); executeLogin();" class="space-y-4 text-xs">
          <div>
            <label for="gateLoginEmail" class="block font-medium text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <i data-lucide="mail" class="w-4 h-4"></i>
              </span>
              <input id="gateLoginEmail" type="email" required placeholder="name@company.com" class="w-full pl-9 pr-3 py-2 border border-slate-200 dark:border-[#38383e] rounded-lg bg-slate-50 dark:bg-[#202024] text-slate-800 dark:text-slate-200 font-medium focus:outline-none focus:ring-1 focus:ring-slate-400">
            </div>
          </div>

          <div>
            <label for="gateLoginPassword" class="block font-medium text-slate-700 dark:text-slate-300 mb-1">Password</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <i data-lucide="lock" class="w-4 h-4"></i>
              </span>
              <input id="gateLoginPassword" type="password" required placeholder="••••••••" class="w-full pl-9 pr-10 py-2 border border-slate-200 dark:border-[#38383e] rounded-lg bg-slate-50 dark:bg-[#202024] text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-slate-400">
              <button type="button" onclick="togglePasswordVisibility('gateLoginPassword')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" title="Toggle password visibility">
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <button type="submit" id="gateLoginSubmitBtn" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 dark:bg-[#27272a] dark:hover:bg-[#38383e] text-white font-medium rounded-xl shadow-xs transition-colors flex items-center justify-center gap-2 text-xs border border-transparent dark:border-[#38383e]">
            <i data-lucide="log-in" class="w-4 h-4"></i> Sign In to Work OS
          </button>

          <!-- Quick 1-Click Access for Registered Accounts -->
          <div class="pt-3 border-t border-slate-100 dark:border-slate-800 space-y-2">
            <div class="text-[11px] font-medium text-slate-500 dark:text-slate-400 flex items-center justify-between">
              <span>Quick 1-Click Account Sign In:</span>
              <span class="text-[10px] text-slate-400 font-mono">Instant Auth</span>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <button type="button" onclick="executeLogin('azarelclightn@gmail.com', 'azarel123')" class="p-2.5 rounded-xl border border-slate-200 dark:border-[#2c2c32] bg-slate-50 hover:bg-slate-100 dark:bg-[#1e1e24] dark:hover:bg-[#282830] transition-colors text-left flex items-center gap-2 group">
                <div class="w-7 h-7 rounded-lg bg-blue-500/10 text-blue-600 dark:text-blue-400 flex items-center justify-center font-bold text-xs flex-shrink-0">
                  A
                </div>
                <div class="min-w-0 flex-1">
                  <div class="font-medium text-[11px] text-slate-900 dark:text-white truncate">Azarel Clight</div>
                  <div class="text-[9px] text-slate-400 truncate">Lead Architect</div>
                </div>
              </button>

              <button type="button" onclick="executeLogin('admin@openflow.io', 'admin123')" class="p-2.5 rounded-xl border border-slate-200 dark:border-[#2c2c32] bg-slate-50 hover:bg-slate-100 dark:bg-[#1e1e24] dark:hover:bg-[#282830] transition-colors text-left flex items-center gap-2 group">
                <div class="w-7 h-7 rounded-lg bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 flex items-center justify-center font-medium text-xs flex-shrink-0">
                  <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
                </div>
                <div class="min-w-0 flex-1">
                  <div class="font-medium text-[11px] text-slate-900 dark:text-white truncate">System Admin</div>
                  <div class="text-[9px] text-slate-400 truncate">Root Admin</div>
                </div>
              </button>
            </div>
          </div>

          <!-- Direct Link to Create Account -->
          <div class="pt-3 text-center border-t border-slate-100 dark:border-slate-800">
            <button type="button" onclick="switchGatewayTab('register')" class="text-xs font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:underline transition-all inline-flex items-center gap-1">
              <span>Don't have an account?</span>
              <span class="font-semibold underline">Create an account</span> →
            </button>
          </div>
        </form>

        <!-- TAB 2: GATEWAY REGISTRATION FORM -->
        <form id="gateRegisterForm" onsubmit="event.preventDefault(); executeRegister();" class="space-y-3 text-xs hidden">
          <div>
            <label for="gateRegFullName" class="block font-medium text-slate-700 dark:text-slate-300 mb-1">Full Name *</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <i data-lucide="user" class="w-4 h-4"></i>
              </span>
              <input id="gateRegFullName" type="text" required placeholder="e.g. Maria Santos" class="w-full pl-9 pr-3 py-2 border border-slate-200 dark:border-[#38383e] rounded-lg bg-slate-50 dark:bg-[#202024] text-slate-800 dark:text-slate-200 font-medium focus:outline-none">
            </div>
          </div>

          <div>
            <label for="gateRegEmail" class="block font-medium text-slate-700 dark:text-slate-300 mb-1">Email Address *</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <i data-lucide="mail" class="w-4 h-4"></i>
              </span>
              <input id="gateRegEmail" type="email" required placeholder="name@company.com" class="w-full pl-9 pr-3 py-2 border border-slate-200 dark:border-[#38383e] rounded-lg bg-slate-50 dark:bg-[#202024] text-slate-800 dark:text-slate-200 focus:outline-none">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label for="gateRegPassword" class="block font-medium text-slate-700 dark:text-slate-300 mb-1">Password *</label>
              <input id="gateRegPassword" type="password" required placeholder="••••••••" class="w-full px-3 py-2 border border-slate-200 dark:border-[#38383e] rounded-lg bg-slate-50 dark:bg-[#202024] text-slate-800 dark:text-slate-200 focus:outline-none">
            </div>
            <div>
              <label for="gateRegConfirmPassword" class="block font-medium text-slate-700 dark:text-slate-300 mb-1">Confirm Password *</label>
              <input id="gateRegConfirmPassword" type="password" required placeholder="••••••••" class="w-full px-3 py-2 border border-slate-200 dark:border-[#38383e] rounded-lg bg-slate-50 dark:bg-[#202024] text-slate-800 dark:text-slate-200 focus:outline-none">
            </div>
          </div>

          <div>
            <label for="gateRegOrg" class="block font-medium text-slate-700 dark:text-slate-300 mb-1">Department / Organization *</label>
            <input id="gateRegOrg" type="text" required placeholder="e.g. Core Engineering, Kryptiah" class="w-full px-3 py-2 border border-slate-200 dark:border-[#38383e] rounded-lg bg-slate-50 dark:bg-[#202024] text-slate-800 dark:text-slate-200 focus:outline-none">
          </div>

          <div>
            <label for="gateRegRole" class="block font-medium text-slate-700 dark:text-slate-300 mb-1">Assigned Role & Permissions *</label>
            <select id="gateRegRole" class="w-full px-3 py-2 border border-slate-200 dark:border-[#38383e] rounded-lg bg-slate-50 dark:bg-[#202024] text-slate-800 dark:text-slate-200 font-medium focus:outline-none">
              <option value="admin" selected>Lead Administrator (Full Admin)</option>
              <option value="dept_head">Department Lead (Editor)</option>
              <option value="inspector">QA & Security Inspector (Approver)</option>
              <option value="contractor">External Partner (Redacted Financials)</option>
              <option value="auditor">Compliance Auditor (Read-Only)</option>
            </select>
          </div>

          <button type="submit" id="gateRegisterSubmitBtn" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 dark:bg-[#27272a] dark:hover:bg-[#38383e] text-white font-medium rounded-lg shadow-xs transition-colors flex items-center justify-center gap-2 mt-2 border border-transparent dark:border-[#38383e]">
            <i data-lucide="user-check" class="w-4 h-4"></i> Create Work OS Account
          </button>

          <!-- Direct Link to Sign In -->
          <div class="pt-2 text-center">
            <button type="button" onclick="switchGatewayTab('login')" class="text-xs font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:underline transition-all inline-flex items-center gap-1">
              <span>Already have an account?</span>
              <span class="font-semibold underline">Sign In</span> →
            </button>
          </div>
        </form>

      </div>
    </div>
  </main>

  <!-- Gateway Footer -->
  <footer class="relative z-10 px-6 py-4 border-t border-slate-200 dark:border-slate-800/80 bg-white/50 dark:bg-[#121214]/50 text-center text-xs text-slate-400 transition-colors font-mono">
    <span>OpenFlow Work OS • Enterprise Cloud Turso & SQLite • Zero-Trust Session Active</span>
  </footer>

  <script>
    function initTheme() {
      const savedTheme = localStorage.getItem('openflow_theme') || 'dark';
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
        document.body.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
        document.body.classList.remove('dark');
      }
      if (window.lucide) lucide.createIcons();
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      const nextTheme = isDark ? 'light' : 'dark';
      if (nextTheme === 'dark') {
        document.documentElement.classList.add('dark');
        document.body.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
        document.body.classList.remove('dark');
      }
      localStorage.setItem('openflow_theme', nextTheme);
      if (window.lucide) lucide.createIcons();
    }

    function switchGatewayTab(tab) {
      const loginForm = document.getElementById('gateLoginForm');
      const registerForm = document.getElementById('gateRegisterForm');
      const tabLoginBtn = document.getElementById('gateTabLoginBtn');
      const tabRegisterBtn = document.getElementById('gateTabRegisterBtn');
      const alertBox = document.getElementById('gateAlertBox');

      if (alertBox) alertBox.classList.add('hidden');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        tabLoginBtn.className = "flex-1 py-1.5 rounded-md bg-white dark:bg-[#28282e] text-slate-900 dark:text-white shadow-2xs transition-all text-center";
        tabRegisterBtn.className = "flex-1 py-1.5 rounded-md text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all text-center";
      } else {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        tabRegisterBtn.className = "flex-1 py-1.5 rounded-md bg-white dark:bg-[#28282e] text-slate-900 dark:text-white shadow-2xs transition-all text-center";
        tabLoginBtn.className = "flex-1 py-1.5 rounded-md text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all text-center";
      }
      if (window.lucide) lucide.createIcons();
    }

    function showGatewayAlert(msg, type) {
      const alertBox = document.getElementById('gateAlertBox');
      if (!alertBox) return;

      alertBox.textContent = msg;
      alertBox.className = `p-3 rounded-lg text-xs font-medium ${type === 'error' ? 'bg-red-500/10 text-red-600 dark:text-red-400 border border-red-500/20' : 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20'}`;
      alertBox.classList.remove('hidden');
    }

    function togglePasswordVisibility(inputId) {
      const inp = document.getElementById(inputId);
      if (inp) {
        inp.type = inp.type === 'password' ? 'text' : 'password';
      }
    }

    async function executeLogin(explicitEmail, explicitPassword) {
      const emailInp = document.getElementById('gateLoginEmail');
      const passInp = document.getElementById('gateLoginPassword');
      const submitBtn = document.getElementById('gateLoginSubmitBtn');

      const email = explicitEmail || (emailInp ? emailInp.value.trim() : '');
      const password = explicitPassword || (passInp ? passInp.value : '');

      if (!email || !password) {
        showGatewayAlert('Please provide both email and password.', 'error');
        return;
      }

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Authenticating...`;
        if (window.lucide) lucide.createIcons();
      }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.removeItem('openflow_logged_out');
          localStorage.setItem('openflow_session_token', data.token);
          localStorage.setItem('openflow_user', JSON.stringify(data.user));

          showGatewayAlert('Authentication successful! Loading workspace...', 'success');
          setTimeout(() => {
            window.location.replace('/');
          }, 300);
        } else {
          showGatewayAlert(data.error || 'Invalid email or password.', 'error');
        }
      } catch (err) {
        console.error("Login request error:", err);
        showGatewayAlert('Connection error while contacting server.', 'error');
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i> Sign In to Work OS`;
          if (window.lucide) lucide.createIcons();
        }
      }
    }

    async function executeRegister() {
      const fullName = document.getElementById('gateRegFullName').value.trim();
      const email = document.getElementById('gateRegEmail').value.trim();
      const password = document.getElementById('gateRegPassword').value;
      const confirmPassword = document.getElementById('gateRegConfirmPassword').value;
      const organization = document.getElementById('gateRegOrg').value.trim() || 'Kryptiah';
      const role = document.getElementById('gateRegRole').value || 'dept_head';
      const submitBtn = document.getElementById('gateRegisterSubmitBtn');

      if (!fullName || !email || !password) {
        showGatewayAlert('Please complete all required fields.', 'error');
        return;
      }

      if (password !== confirmPassword) {
        showGatewayAlert('Passwords do not match. Please verify.', 'error');
        return;
      }

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Creating Account...`;
        if (window.lucide) lucide.createIcons();
      }

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            full_name: fullName,
            email: email,
            password: password,
            organization: organization,
            role: role
          })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.removeItem('openflow_logged_out');
          localStorage.setItem('openflow_session_token', data.token);
          localStorage.setItem('openflow_user', JSON.stringify(data.user));

          showGatewayAlert('Account created successfully! Loading workspace...', 'success');
          setTimeout(() => {
            window.location.replace('/');
          }, 300);
        } else {
          showGatewayAlert(data.error || 'Registration failed.', 'error');
        }
      } catch (err) {
        console.error("Registration error:", err);
        showGatewayAlert('Connection error while contacting server.', 'error');
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<i data-lucide="user-check" class="w-4 h-4"></i> Create Work OS Account`;
          if (window.lucide) lucide.createIcons();
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
    });
  </script>
</body>
</html>
